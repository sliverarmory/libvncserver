name: Publish desktop release

on:
  push:
    tags: ['desktop-v*']
  # Select an existing desktop-vX.Y.Z tag when dispatching manually.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated version tag on master
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$sha" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$sha" origin/master
          printf 'tag=%s\nsha=%s\n' "$RELEASE_TAG" "$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test release libraries
    needs: validate
    uses: ./.github/workflows/desktop-shared-libraries.yml
    permissions:
      contents: read

  publish:
    name: Verify assets and publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vncdesktop-*-${{ needs.validate.outputs.sha }}
          path: artifacts
      - name: Validate all five platforms and package release assets
        run: >-
          python utils/package_desktop_release.py --artifacts artifacts
          --output release-assets --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Write release notes
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          repo, sha, tag = (os.environ[key] for key in ('GH_REPO', 'SOURCE_COMMIT', 'RELEASE_TAG'))
          run = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          notes = f"""Desktop sharing libraries for macOS (arm64/x86_64), Linux (arm64/x86_64), and Windows (x86_64).

          `int32_t start(int32_t port)` shares the host desktop on `127.0.0.1:port` and returns after startup. Use `vnc_stop()` before unloading.

          - Source commit: `{sha}`
          - Build and test run: {run}
          - Usage and platform requirements: https://github.com/{repo}/blob/{sha}/doc/desktop-library.md
          - Each archive includes the public header, usage guide, GPL license, and per-file provenance manifest.
          - `SHA256SUMS` and `release.json` verify all five platform archives.

          Linux requires X11 (Wayland is not supported). Windows requires an interactive desktop. macOS requires macOS 14+ and Screen Recording plus Accessibility permissions. Native macOS capture tests explicitly skip on hosted runners without those grants; protocol/ABI tests remain mandatory.

          The listener is IPv4 loopback only and has no VNC password; local users can view/control the desktop while it runs.
          """
          Path('release-notes.md').write_text('\n'.join(line.strip() for line in notes.splitlines()) + '\n', encoding='utf-8')
          PY
      - name: Create or resume draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > existing-release.json 2>/dev/null; then
            # Never modify an already-published release or another commit's draft.
            jq -e --arg sha "$SOURCE_COMMIT" '.isDraft == true and .targetCommitish == $sha' existing-release.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --target "$SOURCE_COMMIT" \
              --draft --title "Desktop server $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Verify uploaded assets before publication
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded-assets
          python - <<'PY'
          from pathlib import Path
          expected, actual = Path('release-assets'), Path('downloaded-assets')
          assert {p.name for p in expected.iterdir()} == {p.name for p in actual.iterdir()}, 'Release asset set differs'
          for path in expected.iterdir():
              assert path.read_bytes() == (actual / path.name).read_bytes(), f'Uploaded asset differs: {path.name}'
          print('All seven uploaded release assets match the tested build byte-for-byte')
          PY
          (cd downloaded-assets && sha256sum --check SHA256SUMS)
      - name: Publish release and verify public state
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
          gh release view "$RELEASE_TAG" --json isDraft,tagName,targetCommitish,url,assets > published-release.json
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_COMMIT" \
            '.isDraft == false and .tagName == $tag and .targetCommitish == $sha and (.assets | length) == 7' published-release.json
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
